<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A simple GPA calculator for CUST, COMSATS, Air University and Bahria University.">
  <title>CGPA Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #navbar {
      width: 100%;
      margin: 0 auto 28px;
    }

    .uni-navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 105px;
      color: #fff;
      opacity: .7;
      cursor: pointer;
      transition: transform .25s ease, opacity .25s ease;
    }

    .nav-item img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .nav-item span {
      font-size: 14px;
      font-weight: 500;
    }

    .nav-item:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    .nav-item.active {
      opacity: 1;
    }

    .nav-item.active span {
      color: #4cafef;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(76,175,239,.45);
    }

    #column2 {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 24px;
      background: rgba(16,16,16,.43);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(13,38,38,.35);
    }

    .gpa-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .progress-bar-container {
      flex: 0 0 150px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gpa-wheel {
      --progress: 0;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background:
        radial-gradient(closest-side, #000 78%, transparent 80% 100%),
        conic-gradient(#4cafef calc(var(--progress) * 25%), #ddd 0);
      font-size: 20px;
      font-weight: 700;
      transition: background .45s ease;
    }

    .tables-container {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 22px;
    }

    #courses {
      flex: 1.2;
      min-width: 300px;
      padding: 16px;
      background: rgba(16,16,16,.56);
      border: 1px solid #fff;
      border-radius: 5px;
      box-shadow: 0 8px 32px rgba(13,38,38,.35);
    }

    #grades {
      flex: 1;
      min-width: 220px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #table01 th {
      padding: 10px 6px;
      border-bottom: 2px solid #fff;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    #table01 td {
      padding: 9px 5px;
      text-align: center;
      font-size: 14px;
    }

    #grade-scale-table {
      background: rgba(16,16,16,.56);
      border: 1px solid #fff;
      border-radius: 5px;
      box-shadow: 0 8px 32px rgba(13,38,38,.35);
      overflow: hidden;
    }

    #grade-scale-table th,
    #grade-scale-table td {
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.75);
      text-align: center;
      font-size: 14px;
    }

    .gpa-menu {
      position: relative;
      height: 58px;
      overflow: hidden;
      color: #fff;
      cursor: ns-resize;
      perspective: 500px;
    }

    .gpa-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      transform-style: preserve-3d;
      transition: transform .2s ease;
    }

    .gpa-menu li {
      min-height: 26px;
      padding: 4px 6px;
      border-radius: 4px;
      text-align: center;
      font-size: 14px;
      opacity: 0;
      transform: scale(.9);
      pointer-events: none;
      transition: all .2s ease;
    }

    .gpa-menu li.active {
      opacity: 1;
      transform: scale(1.12);
      color: #4cafef;
      font-weight: 700;
      pointer-events: auto;
    }

    .gpa-menu li.neighbor {
      opacity: .45;
      transform: scale(.95);
    }

    .checkbox-td {
      width: 28px;
      color: #ff5555;
      cursor: pointer;
      font-size: 18px !important;
    }

    .button-container {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    .animated-button {
      padding: 9px 20px;
      border: 1px solid #fff;
      border-radius: 4px;
      background: transparent;
      color: #fff;
      font-size: 15px;
      transition: background .2s ease, color .2s ease;
    }

    .animated-button:hover {
      background: #fff;
      color: #000;
    }

    @media (max-width: 760px) {
      body { padding: 14px; }
      .nav-item img { width: 65px; height: 65px; }
      .uni-navbar { gap: 14px; }
      #column2 { padding: 16px 10px; }
      .gpa-layout { flex-direction: column; gap: 12px; }
      .progress-bar-container { flex-basis: auto; }
      .tables-container {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
      }
      #courses, #grades { width: 100%; min-width: 0; }
      #table01 th, #table01 td,
      #grade-scale-table th, #grade-scale-table td {
        font-size: 13px;
        padding: 8px 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="navbar">
    <div class="uni-navbar" aria-label="Choose university">
      <div class="nav-item" data-uni="CUST" role="button" tabindex="0">
        <img src="images/cust.png" alt="CUST logo"><span>Cust</span>
      </div>
      <div class="nav-item active" data-uni="COMSATS" role="button" tabindex="0">
        <img src="images/Comsats.svg" alt="COMSATS logo"><span>COMSATS</span>
      </div>
      <div class="nav-item" data-uni="Air" role="button" tabindex="0">
        <img src="images/Air.svg" alt="Air University logo"><span>Air</span>
      </div>
      <div class="nav-item" data-uni="Bahria" role="button" tabindex="0">
        <img src="images/Bahria.svg" alt="Bahria University logo"><span>Bahria</span>
      </div>
    </div>
  </div>

  <main id="column2">
    <div class="gpa-layout">
      <div class="progress-bar-container">
        <div class="gpa-wheel" id="gpaWheel" data-value="0.00" aria-live="polite">0.00</div>
      </div>

      <div class="tables-container">
        <section id="courses">
          <table id="table01">
            <thead>
              <tr>
                <th>Courses</th>
                <th>GPA</th>
                <th>Credit Hours</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="courseRows"></tbody>
          </table>
          <div class="button-container">
            <button class="animated-button" id="add" type="button">Add</button>
          </div>
        </section>

        <section id="grades">
          <table id="grade-scale-table">
            <thead>
              <tr>
                <th>Grade</th>
                <th>Marks (%)</th>
                <th>GPA</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
      </div>
    </div>
  </main>

  <script>
    "use strict";

    const gradeScales = {
      CUST: [
        {grade:"A",marks:"90-100",gpa:4.00},{grade:"A-",marks:"86-89",gpa:3.67},{grade:"B+",marks:"81-85",gpa:3.33},{grade:"B",marks:"77-80",gpa:3.00},{grade:"B-",marks:"72-76",gpa:2.67},{grade:"C+",marks:"68-71",gpa:2.33},{grade:"C",marks:"63-67",gpa:2.00},{grade:"C-",marks:"58-62",gpa:1.67},{grade:"D+",marks:"54-57",gpa:1.33},{grade:"D",marks:"50-53",gpa:1.00},{grade:"F",marks:"Below 50",gpa:0.00}
      ],
      COMSATS: [
        {grade:"A",marks:"85 and above",gpa:4.00},{grade:"A-",marks:"80-84",gpa:3.66},{grade:"B+",marks:"75-79",gpa:3.33},{grade:"B",marks:"71-74",gpa:3.00},{grade:"B-",marks:"68-70",gpa:2.66},{grade:"C+",marks:"64-67",gpa:2.33},{grade:"C",marks:"61-63",gpa:2.00},{grade:"C-",marks:"58-60",gpa:1.66},{grade:"D+",marks:"54-57",gpa:1.30},{grade:"D",marks:"50-53",gpa:1.00},{grade:"F",marks:"Below 50",gpa:0.00}
      ],
      Air: [
        {grade:"A",marks:"80-100",gpa:4.00},{grade:"A-",marks:"75-79.99",gpa:3.67},{grade:"B+",marks:"70-74.99",gpa:3.33},{grade:"B",marks:"65-69.99",gpa:3.00},{grade:"B-",marks:"60-64.99",gpa:2.67},{grade:"C+",marks:"55-59.99",gpa:2.33},{grade:"C",marks:"50-54.99",gpa:2.00},{grade:"F",marks:"Below 50",gpa:0.00}
      ],
      Bahria: [
        {grade:"A",marks:"87-100",gpa:4.00},{grade:"B+",marks:"80-86",gpa:3.50},{grade:"B",marks:"72-79",gpa:3.00},{grade:"C+",marks:"66-71",gpa:2.50},{grade:"C",marks:"60-65",gpa:2.00},{grade:"D",marks:"50-59",gpa:1.50},{grade:"F",marks:"Below 50",gpa:0.00}
      ]
    };

    const courseRows = document.getElementById("courseRows");
    const gpaWheel = document.getElementById("gpaWheel");
    let activeUniversity = "COMSATS";
    let courseNumber = 0;

    function createGpaMenu(values, selectedIndex, onChange) {
      const container = document.createElement("div");
      container.className = "gpa-menu";
      container.tabIndex = 0;
      container.setAttribute("role", "listbox");
      container.setAttribute("aria-label", "Select GPA");

      const list = document.createElement("ul");
      container.appendChild(list);

      values.forEach(value => {
        const item = document.createElement("li");
        item.textContent = Number(value).toFixed(2);
        list.appendChild(item);
      });

      const items = [...list.children];
      let index = selectedIndex;

      function render(notify = true) {
        items.forEach((item, itemIndex) => {
          item.classList.toggle("active", itemIndex === index);
          item.classList.toggle("neighbor", Math.abs(itemIndex - index) === 1);
        });

        const selected = items[index];
        list.style.transform = "translateY(" + (container.clientHeight / 2 - selected.offsetTop - selected.offsetHeight / 2) + "px)";
        if (notify) onChange(Number(values[index]));
      }

      function move(direction) {
        const next = Math.max(0, Math.min(values.length - 1, index + direction));
        if (next !== index) {
          index = next;
          render();
        }
      }

      container.addEventListener("wheel", event => {
        event.preventDefault();
        move(Math.sign(event.deltaY));
      }, {passive:false});

      container.addEventListener("keydown", event => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          move(event.key === "ArrowDown" ? 1 : -1);
        }
      });

      items.forEach((item, itemIndex) => item.addEventListener("click", () => {
        index = itemIndex;
        render();
      }));

      requestAnimationFrame(() => render(false));
      return container;
    }

    function addCourse() {
      courseNumber += 1;
      const row = document.createElement("tr");
      const nameCell = document.createElement("td");
      nameCell.textContent = "Course " + courseNumber;

      const gpaCell = document.createElement("td");
      const creditsCell = document.createElement("td");
      const removeCell = document.createElement("td");
      removeCell.className = "checkbox-td";
      removeCell.textContent = "×";
      removeCell.title = "Remove course";
      removeCell.setAttribute("aria-label", "Remove course");
      removeCell.addEventListener("click", () => {
        row.remove();
        renumberCourses();
        calculateGpa();
      });

      const scale = gradeScales[activeUniversity];
      const gpaValues = scale.map(item => item.gpa);
      gpaCell.appendChild(createGpaMenu(gpaValues, 0, calculateGpa));

      const creditSelect = document.createElement("select");
      creditSelect.setAttribute("aria-label", "Credit hours");
      creditSelect.style.width = "100%";
      creditSelect.style.padding = "8px 4px";
      creditSelect.style.borderRadius = "4px";
      creditSelect.style.background = "#fff";
      creditSelect.style.color = "#222";
      creditSelect.style.border = "1px solid #ccc";

      [1,2,3,4,5,6].forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        if (value === 3) option.selected = true;
        creditSelect.appendChild(option);
      });

      creditSelect.addEventListener("change", calculateGpa);
      creditsCell.appendChild(creditSelect);
      row.append(nameCell, gpaCell, creditsCell, removeCell);
      courseRows.appendChild(row);
      calculateGpa();
    }

    function renumberCourses() {
      [...courseRows.rows].forEach((row, index) => {
        row.cells[0].textContent = "Course " + (index + 1);
      });
      courseNumber = courseRows.rows.length;
    }

    function calculateGpa() {
      let totalCredits = 0;
      let totalPoints = 0;

      [...courseRows.rows].forEach(row => {
        const credit = Number(row.querySelector("select").value);
        const selectedGpa = Number(row.querySelector(".gpa-menu li.active")?.textContent || 0);
        totalCredits += credit;
        totalPoints += credit * selectedGpa;
      });

      const result = totalCredits ? totalPoints / totalCredits : 0;
      gpaWheel.textContent = result.toFixed(2);
      gpaWheel.dataset.value = result.toFixed(2);
      gpaWheel.style.setProperty("--progress", result);
      const hue = Math.round(result / 4 * 120);
      const color = "hsl(" + hue + ", 75%, 52%)";
      gpaWheel.style.background =
        "radial-gradient(closest-side, #000 78%, transparent 80% 100%), conic-gradient(" +
        color + " " + (result / 4 * 100) + "%, #ddd 0)";
    }

    function populateGradeTable(university) {
      const tbody = document.querySelector("#grade-scale-table tbody");
      tbody.replaceChildren();

      gradeScales[university].forEach(item => {
        const row = document.createElement("tr");
        [item.grade, item.marks, item.gpa.toFixed(2)].forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });
        tbody.appendChild(row);
      });
    }

    function selectUniversity(university) {
      if (university === activeUniversity) return;
      activeUniversity = university;

      document.querySelectorAll(".nav-item").forEach(item => {
        const active = item.dataset.uni === university;
        item.classList.toggle("active", active);
        item.setAttribute("aria-pressed", String(active));
      });

      populateGradeTable(university);
      courseRows.replaceChildren();
      courseNumber = 0;
      addCourse();
      calculateGpa();
    }

    document.querySelectorAll(".nav-item").forEach(item => {
      item.addEventListener("click", () => selectUniversity(item.dataset.uni));
      item.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectUniversity(item.dataset.uni);
        }
      });
    });

    document.getElementById("add").addEventListener("click", addCourse);

    populateGradeTable(activeUniversity);
    addCourse();
  </script>
</body>
</html>

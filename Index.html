<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/Index.css">
    <link rel="stylesheet" href="/css/Table01.css">
    <link rel="stylesheet" href="/css/Column1.css">
    <link rel="stylesheet" href="/css/Column2.css">
    <link rel="stylesheet" href="/css/Slider.css">
    <link rel="stylesheet" href="/css/uni-picker.css">
    <link rel="stylesheet" href="/css/Gpa-Wheel.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <title>Document</title>
</head>

<body style="background-color: black; color: white;">



    <div id="navbar">
        <div class="uni-navbar">
            <div class="nav-item">
                <img src="/images/cust.png" alt="Cust Logo">
                <span>Cust</span>
            </div>
            <div class="nav-item active">
                <img src="/images/Comsats.svg" alt="Comsats Logo">
                <span>COMSATS</span>
            </div>
            <div class="nav-item">
                <img src="/images/Air.svg" alt="Air Logo">
                <span>Air</span>
            </div>
            <div class="nav-item">
                <img src="/images/Bahria.svg" alt="Bahria Logo">
                <span>Bahria</span>
            </div>
        </div>
    </div>




    <!-- Grade Table Column -->
    <div id="column2">
        <div class="gpa-layout">
            <!-- GPA Wheel -->
            <div class="progress-bar-container">
                <div class="progress-bar gpa-wheel" id="gpaWheel"></div>
            </div>

            <!-- Courses + Grades -->
            <div class="tables-container">
                <section id="courses">
                    <table id="table01">
                        <thead>
                            <tr>
                                <th class="small">Courses</th>
                                <th class="small">GPA</th>
                                <th class="small">Credit Hours</th>
                                <th class="small"></th>
                            </tr>
                        </thead>
                    </table>

                    <div class="button-container">
                        <button class="animated-button" id="add">Add</button>
                    </div>
                </section>

                <section id="grades">
                    <table id="grade-scale-table">
                        <thead>
                            <tr>
                                <th class="grade-scale-header">Grade</th>
                                <th class="grade-scale-header">Marks(%)</th>
                                <th class="grade-scale-header">GPA</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- JS will populate rows -->
                        </tbody>
                    </table>
                </section>
            </div>
        </div>
    </div>



    <script src="/js/Table01.js" defer></script>
    <script src="/js/Table02.js" defer></script>
    <script src="/js/Gpa-wheel.js" defer></script>

    </script>

</body>

</html>

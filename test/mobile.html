<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Table01.css">
    <link rel="stylesheet" href="Column1.css">
    <link rel="stylesheet" href="Column2.css">
    <link rel="stylesheet" href="Slider.css">
    <link rel="stylesheet" href="Gpa-Wheel.css">
    <link rel="stylesheet" href="uni-picker2.css">
    <link rel="stylesheet" href="responsive.css" media="(max-width: 1165px)">

    <title>Document</title>
</head>

<body style="background-color: black; color: white;">

    <div class="container">
        <!-- Column 1: University Names -->
        <div id="column1">
            <div class="uni-picker">
                <ul>
                    <li class="active"><span>Cust</span></li>
                    <li><span>COMSATS</span></li>
                    <li><span>Air</span></li>
                    <li><span>Bahria</span></li>
                </ul>
            </div>
        </div>

        <!-- Column 2: University Logos + GPA + Tables -->
        <div id="column2">
            <div class="gpa-layout">
                <!-- University Logos -->
                <div class="uni-picker">
                    <ul>
                        <li class="active"><img src="cust.png" alt="Cust Logo" /></li>
                        <li><img src="Comsats.png" alt="Comsats Logo" /></li>
                        <li><img src="Air.png" alt="Air Logo" /></li>
                        <li><img src="Bahria.png" alt="Bahria Logo" /></li>
                    </ul>
                </div>

                <!-- GPA Wheel -->
                <div class="progress-bar-container">
                    <div class="progress-bar gpa-wheel" id="gpaWheel"></div>
                </div>

                <!-- Courses + Grades -->
                <div class="tables-container" style="
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);">
                    <section id="courses">
                        <table id="table01">
                            <thead>
                                <tr>
                                    <th class="small">Courses</th>
                                    <th class="small">GPA</th>
                                    <th class="small">Credit Hours</th>
                                    <th class="small"></th>
                                </tr>
                            </thead>
                        </table>

                        <div class="button-container">
                            <button class="animated-button" id="add">Add</button>
                        </div>
                    </section>

                    <section id="grades">
                        <table id="grade-scale-table">
                            <thead>
                                <tr>
                                    <th class="grade-scale-header">Grade</th>
                                    <th class="grade-scale-header">Marks(%)</th>
                                    <th class="grade-scale-header">GPA</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- JS will populate rows -->
                            </tbody>
                        </table>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <script src="Table01.js" defer></script>
    <script src="Table02.js" defer></script>
    <script src="uni-picker2.js" defer></script>
    <script src="Gpa-wheel.js" defer></script>
    <script>
        function checkWidth() {
            if (window.innerWidth > 1165) {
                window.location.href = "index.html";
            }
        }
        window.addEventListener("load", checkWidth);
        window.addEventListener("resize", checkWidth);</script>

</body>


</html>

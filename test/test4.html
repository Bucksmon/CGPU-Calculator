<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPA Calculator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* Navbar container */
    .navbar {
      background-color: #004d66; /* dark teal */
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /* Navbar links */
    .navbar a {
      color: white;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
      font-size: 16px;
      transition: background 0.3s;
    }

    /* Hover effect */
    .navbar a:hover {
      background-color: #006680;
    }

    /* Active link */
    .navbar a.active {
      background-color: #0088a9;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <a href="#" class="active">CUST</a>
    <a href="#">FAST</a>
    <a href="#">LUMS</a>
    <a href="#">IBA</a>
    <a href="#">NUST</a>
  </div>

  <div style="padding:20px; text-align:center;">
    <h2>Welcome to GPA Calculator</h2>
    <p>Select your university from the navbar above.</p>
  </div>

</body>
</html>

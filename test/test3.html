<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    </style>
</head>

<body>
    <!-- HTML -->
    <div class="progress-bar-container">
        <div class="progress-bar gpa-wheel" id="gpaWheel"></div>
    </div>
    <script>// JS
        let Gpa = 3.2; // Example GPA variable (0.0 - 4.0)

        const gpaWheel = document.getElementById("gpaWheel");

        // Update function
        function updateGpaWheel(value) {
            if (value < 0) value = 0;
            if (value > 4) value = 4;

            gpaWheel.style.setProperty("--progress-value", value);
            gpaWheel.setAttribute("data-value", value.toFixed(2)); // floating number
        }

        // Initialize
        updateGpaWheel(Gpa);

        // Example: dynamically change GPA after 2s
        setTimeout(() => {
            Gpa = 3.8;
            updateGpaWheel(Gpa);
        }, 2000);
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPA Slider Hover-Visible</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --bg: #000;
            --fg: #fff;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px) 0 0/40px 40px,
                linear-gradient(0deg, rgba(255, 255, 255, .05) 1px, transparent 1px) 0 0/40px 40px;
            mask: linear-gradient(#0000, #000 15%, #000 85%, #0000);
        }

        /* GPA MENU */
        .gpa-menu {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
        }

        .gpa-menu ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform-style: preserve-3d;
            transition: transform .35s cubic-bezier(.22, .61, .36, 1);
        }

        .gpa-menu li {
            font-size: 20px;
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
            transition: all .25s ease;
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            position: relative;
        }

        .gpa-menu li.active {
            opacity: 1;
            transform: scale(1.2);
            pointer-events: auto;
        }

        /* dropdown icon instead of arrow */
        .gpa-menu li.active::after {
            content: "\f282";
            /* bootstrap-icons chevron-down */
            font-family: "bootstrap-icons";
            font-size: 18px;
            margin-left: 6px;
            position: relative;
            top: 2px;
            color: var(--fg);
            transition: transform 0.5s ease;
        }

        /* hide dropdown icon when hovered */
        .gpa-menu:hover li.active::after {
            content: none;    
        }

        /* neighbors hidden by default */
        .gpa-menu li.neighbor {
            opacity: 0;
            transform: scale(0.95);
        }

        /* show neighbors only when container is hovered */
        .gpa-menu:hover li.neighbor {
            
            opacity: 0.6;
            
            transform: translateZ(-50px) scale(1.05);
        }

        /* RADIO BUTTONS */
        .radio-label {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            user-select: none;
            white-space: nowrap;
        }

        .radio-input {
            display: none;
        }

        .radio-custom {
            width: 22px;
            height: 22px;
            background-color: transparent;
            border-radius: 50%;
            margin-right: 12px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .radio-custom::before {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: #8a8b9f;
            border-radius: 50%;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .radio-custom::after {
            content: "";
            position: absolute;
            width: 34px;
            height: 34px;
            border: 2px solid transparent;
            border-radius: 50%;
            border-top-color: #00a6ff;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.4s ease;
        }

        .radio-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #c1c3d9;
            transition: color 0.3s ease;
        }

        .radio-label:hover .radio-input:not(:checked)+.radio-custom {
            transform: scale(1.1);
            
            border-color: #8a8daf;
        }

        .radio-label:hover .radio-text {
            
            color: #e2e4f4;
        }

        .radio-input:checked+.radio-custom {
            border-color: #00a6ff;
            transform: scale(0.9);
        }

        .radio-input:checked+.radio-custom::before {
            transform: scale(1);
            background-color: #00a6ff;
        }

        .radio-input:checked+.radio-custom::after {
            opacity: 1;
            transform: scale(1.3);
            animation: orbit 2.5s infinite linear;
            box-shadow:
                0 0 30px #00a6ff,
                0 0 80px rgba(0, 166, 255, 0.2);
        }

        .radio-input:checked~.radio-text {
            color: #ffffff;
            font-weight: 700;
        }

        /* variations for 2nd and 3rd radio */
        .radio-label:nth-child(2) .radio-input:checked+.radio-custom {
            border-color: #e900ff;
        }

        .radio-label:nth-child(2) .radio-input:checked+.radio-custom::before {
            background-color: #e900ff;
        }

        .radio-label:nth-child(2) .radio-input:checked+.radio-custom::after {
            border-top-color: #e900ff;
            box-shadow:
                0 0 30px #e900ff,
                0 0 80px rgba(233, 0, 255, 0.2);
        }

        .radio-label:nth-child(3) .radio-input:checked+.radio-custom {
            border-color: #00ffc2;
        }

        .radio-label:nth-child(3) .radio-input:checked+.radio-custom::before {
            background-color: #00ffc2;
        }

        .radio-label:nth-child(3) .radio-input:checked+.radio-custom::after {
            border-top-color: #00ffc2;
            box-shadow:
                0 0 30px #00ffc2,
                0 0 80px rgba(0, 255, 194, 0.2);
        }

        @keyframes orbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .gpa-menu {
                top: 10px;
            }

            .gpa-menu li {
                font-size: 16px;
            }

            .radio-text {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="gpa-menu" id="gpaPicker" aria-label="GPA picker">
        <ul id="gpa-list">
            <li><label class="radio-label">
                    <input checked="" type="radio" name="option" class="radio-input" />
                    <span class="radio-custom"></span>
                    <span class="radio-text">you</span>
                </label></li>
            <li class="active"><label class="radio-label">
                    <input type="radio" name="option" class="radio-input" />
                    <span class="radio-custom"></span>
                    <span class="radio-text">cook</span>
                </label></li>
            <li>fast</li>
            <li>🔥</li>
        </ul>
    </div>

    <script>
        function initSlider(containerId, listId) {
            const container = document.getElementById(containerId);
            const ul = document.getElementById(listId);
            const items = Array.from(ul.querySelectorAll('li'));

            let index = items.findIndex(li => li.classList.contains("active"));
            if (index === -1) index = 0;

            function centerSelected() {
                const selected = items[index];
                const selectedCenter = selected.offsetTop + selected.offsetHeight / 2;
                const containerCenter = container.clientHeight / 2;
                const translateY = containerCenter - selectedCenter;
                ul.style.transform = `translateY(${translateY}px)`;
            }

            function updateMenu() {
                items.forEach((li, i) => {
                    const radio = li.querySelector(".radio-input");
                    if (radio) radio.checked = false; // reset all

                    li.classList.remove("active", "neighbor");
                    if (i === index) {
                        li.classList.add("active");
                        if (radio) radio.checked = true; // only active item is checked
                    } else if (i === index - 1 || i === index + 1) {
                        li.classList.add("neighbor");
                    }
                });
                centerSelected();
            }

            function onWheel(e) {
                e.preventDefault();
                if (e.deltaY > 0) index = Math.min(items.length - 1, index + 1);
                else index = Math.max(0, index - 1);
                updateMenu();
            }

            container.addEventListener('wheel', onWheel, { passive: false });
            items.forEach((li, i) => li.addEventListener('click', () => { index = i; updateMenu(); }));

            window.addEventListener('resize', centerSelected);

            updateMenu();
        }

        initSlider("gpaPicker", "gpa-list");


    </script>

</body>

</html>

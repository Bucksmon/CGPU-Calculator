<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Wheel</title>
  <style>
    body {
      background-color: black;
      margin: 0;
    }

    .wheel {
      position: fixed;
      top: 50%;
      left: -15%; /* push wheel more to the left */
      width: 400px;
      height: 400px;
      transform: translateY(-50%) rotate(0deg);
      transform-origin: center;
      transition: transform 0.4s ease-out;
    }

    /* Each radio-label acts like an arc */
    .wheel .radio-label {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 50%;
      transform-origin: 0% 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding-left: 10%;
      transform: rotate(var(--rotation));
    }

    /* Rotate back the text so it looks upright */
    .wheel .radio-text {
      transform: rotate(calc(var(--rotation) * -1));
    }

    /* Position each item */
    .wheel .radio-label:nth-child(1) {
      --rotation: -30deg;
    }

    .wheel .radio-label:nth-child(2) {
      --rotation: 30deg;
    }

    .wheel .radio-label:nth-child(3) {
      --rotation: 90deg;
    }

    /* --- Your original option styling (unchanged) --- */
    .radio-label {
      display: flex;
      align-items: center;
      margin: 30px 0;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .radio-input {
      display: none;
    }

    .radio-custom {
      width: 22px;
      height: 22px;
      background-color: transparent;
      border: 2px solid #5c5e79;
      border-radius: 50%;
      margin-right: 18px;
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .radio-custom::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #8a8b9f;
      border-radius: 50%;
      transform: scale(0);
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .radio-custom::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      border: 2px solid transparent;
      border-radius: 50%;
      border-top-color: #00a6ff;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.4s ease;
    }

    .radio-text {
      font-size: 1.1rem;
      font-weight: 500;
      color: #c1c3d9;
      transition: color 0.3s ease;
    }

    .radio-label:hover .radio-input:not(:checked)+.radio-custom {
      transform: scale(1.1);
      border-color: #8a8daf;
    }

    .radio-label:hover .radio-text {
      color: #e2e4f4;
    }

    .radio-input:checked+.radio-custom {
      border-color: #00a6ff;
      transform: scale(0.9);
    }

    .radio-input:checked+.radio-custom::before {
      transform: scale(1);
      background-color: #00a6ff;
    }

    .radio-input:checked+.radio-custom::after {
      opacity: 1;
      transform: scale(1.3);
      animation: orbit 2.5s infinite linear;
      box-shadow:
        0 0 30px #00a6ff,
        0 0 80px rgba(0, 166, 255, 0.2);
    }

    .radio-input:checked~.radio-text {
      color: #ffffff;
      font-weight: 700;
    }

    .radio-label:nth-child(2) .radio-input:checked+.radio-custom {
      border-color: #e900ff;
    }

    .radio-label:nth-child(2) .radio-input:checked+.radio-custom::before {
      background-color: #e900ff;
    }

    .radio-label:nth-child(2) .radio-input:checked+.radio-custom::after {
      border-top-color: #e900ff;
      box-shadow:
        0 0 30px #e900ff,
        0 0 80px rgba(233, 0, 255, 0.2);
    }

    .radio-label:nth-child(3) .radio-input:checked+.radio-custom {
      border-color: #00ffc2;
    }

    .radio-label:nth-child(3) .radio-input:checked+.radio-custom::before {
      background-color: #00ffc2;
    }

    .radio-label:nth-child(3) .radio-input:checked+.radio-custom::after {
      border-top-color: #00ffc2;
      box-shadow:
        0 0 30px #00ffc2,
        0 0 80px rgba(0, 255, 194, 0.2);
    }

    @keyframes orbit {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="wheel" id="wheel">
    <label class="arc radio-label">
      <input checked type="radio" name="option" class="radio-input" />
      <span class="radio-custom"></span>
      <span class="radio-text">Helios Blue</span>
    </label>

    <label class="arc radio-label">
      <input type="radio" name="option" class="radio-input" />
      <span class="radio-custom"></span>
      <span class="radio-text">Cygnus Magenta</span>
    </label>

    <label class="arc radio-label">
      <input type="radio" name="option" class="radio-input" />
      <span class="radio-custom"></span>
      <span class="radio-text">Orion Lime</span>
    </label>
  </div>

  <script>
    const wheel = document.getElementById("wheel");
    let rotation = 0;

    window.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.deltaY > 0) {
        rotation += 30;
      } else {
        rotation -= 30;
      }
      wheel.style.transform = `translateY(-50%) rotate(${rotation}deg)`;
    }, { passive: false });
  </script>
</body>

</html>
